name: verify
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'branch to build and test'
        required: true
        type: string
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libprotobuf-dev protobuf-compiler libnl-route-3-dev
      - name: build
        run: make -j"$(nproc)"
      - name: unit tests (root)
        run: sudo make test
      - name: cmdline tests
        run: sudo make test-cmdline
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libprotobuf-dev protobuf-compiler libnl-route-3-dev
      - name: asan+ubsan build and unit tests
        run: |
          export PBLIBS=$(pkg-config --libs protobuf)
          export NLLIBS=$(pkg-config --libs libnl-route-3.0 || echo "-lnl-route-3 -lnl-3")
          make -j"$(nproc)" CC=clang CXX=clang++ \
            USER_DEFINES='-fsanitize=address,undefined -fno-sanitize=unsigned-integer-truncation -fno-omit-frame-pointer -O1 -g' \
            LDFLAGS="-pie -Wl,-z,noexecstack -fsanitize=address,undefined -lpthread $PBLIBS $NLLIBS"
          sudo -E make test ASAN_OPTIONS=detect_leaks=0 2>&1 | tail -50
          sudo -E make test-cmdline ASAN_OPTIONS=detect_leaks=0 2>&1 | tail -30
