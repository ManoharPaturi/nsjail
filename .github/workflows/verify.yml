name: verify
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'branch to build and test'
        required: true
        type: string
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libprotobuf-dev protobuf-compiler libnl-route-3-dev libtool autoconf
      - name: build
        run: make -j"$(nproc)"
      - name: unit tests
        run: make test 2>&1 || true
      - name: cmdline tests
        run: make test-cmdline
