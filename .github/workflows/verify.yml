name: verify
on:
  workflow_dispatch:
    inputs:
      branch:
        description: 'branch to build and test'
        required: true
        type: string
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y g++ pkg-config libprotobuf-dev protobuf-compiler libnl-route-3-dev strace
      - name: build
        run: make -j"$(nproc)"
      - name: tests (informational, env-dependent cases expected)
        run: |
          sudo make test 2>&1 | tee /tmp/test.log || true
          echo "=== FAILURES ==="; grep -E "❌" /tmp/test.log || echo "none"
  sanitize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.branch }}
          submodules: recursive
      - name: deps
        run: |
          sudo apt-get update
          sudo apt-get install -y clang pkg-config libprotobuf-dev protobuf-compiler libnl-route-3-dev strace
      - name: build kafel with default flags
        run: make kafel/libkafel.a
      - name: asan+ubsan build
        run: |
          export PBLIBS=$(pkg-config --libs protobuf)
          export NLLIBS=$(pkg-config --libs libnl-route-3.0 || echo "-lnl-route-3 -lnl-3")
          make -j"$(nproc)" CC=clang CXX=clang++ \
            USER_DEFINES='-fsanitize=address,undefined -fno-omit-frame-pointer -O1 -g' \
            LDFLAGS="-pie -Wl,-z,noexecstack -fsanitize=address,undefined -lpthread $PBLIBS $NLLIBS"
      - name: unit tests under sanitizers
        run: |
          sudo -E env ASAN_OPTIONS=detect_leaks=0:abort_on_error=0 UBSAN_OPTIONS=print_stacktrace=1 \
            make test 2>&1 | tee /tmp/asan.log || true
          echo "=== SANITIZER FINDINGS ==="
          grep -E "ERROR: AddressSanitizer|runtime error:|SUMMARY:" /tmp/asan.log || echo "none"
